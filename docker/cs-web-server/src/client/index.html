  <script>
    // Coloca a tela em fullscreen assim que o usuÃ¡rio clica em "Start Game".
    // Precisa ser sÃ­ncrono dentro do handler do clique/submit, senÃ£o o
    // navegador nÃ£o considera "gesto do usuÃ¡rio" e bloqueia o fullscreen.
    document.getElementById('form').addEventListener('submit', (event) => {
      const canvas = document.getElementById('canvas');

      const goFullscreen = () => {
        const request =
          canvas.requestFullscreen ||
          canvas.webkitRequestFullscreen || // Safari
          canvas.mozRequestFullScreen ||    // Firefox antigo
          canvas.msRequestFullscreen;       // Edge/IE antigo

        if (request) {
          request.call(canvas).catch((err) => {
            console.warn('NÃ£o foi possÃ­vel entrar em fullscreen:', err);
          });
        }
      };

      goFullscreen();

      // A lÃ³gica de start do jogo (main.ts) continua rodando normalmente
      // a partir do listener registrado lÃ¡; este script sÃ³ cuida do fullscreen.
    });

    // Opcional: detectar quando o usuÃ¡rio sai do fullscreen (ex: ESC)
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        console.log('Saiu do modo fullscreen');
      }
    });
  </script>
