<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="/main.ts"></script>

    <title>Loading</title>

    <style>
        body {
            background-color: black;
            margin: 0;
        }

        .notDraggable {
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        @keyframes pulsate {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0.75;
            }
        }

        @keyframes pulsate-end {
            0% {
                transform: translate(-50%, -50%) scale(0.75);
                opacity: 0.87;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }

        img {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100vw;
            max-height: 100vh;
            animation-name: pulsate;
            animation-duration: 0.75s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            z-index: 2;
            transition: opacity ease-in-out 0.5s;
        }

        canvas {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        form {
            margin: 0;
            padding: 16px;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: white;
        }

        form > div {
            display: flex;
            justify-content: space-between;
        }

        #warning {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 3;
            text-align: center;
            color: red;
            opacity: 0;
            transition: opacity ease-in-out 0.5s;
        }

        progress {
            border-radius: 1px;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 8px;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        progress::-webkit-progress-bar {
            background-color: #eee;
        }

        progress::-webkit-progress-value {
            background-color: #f6b265;
        }

        progress::-moz-progress-bar {
            background-color: #f6b265;
        }

        #social {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px
        }

        .github {
            width: 24px;
            height: auto;
        }

        .discord {
            width: 24px;
            height: auto;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>
<div id="social">
    <a href="https://github.com/cshidro/" target="_blank">
        <svg width="98" height="96" viewBox="0 0 98 96" xmlns="http://www.w3.org/2000/svg" class="github">
            <path fill-rule="evenodd" clip-rule="evenodd"
                  d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"
                  fill="#fff"/>
        </svg>
    </a>
    
</div>
<img id="logo" alt="Logo" class="notDraggable" src="logo1.png"/>
<progress id="progress" value="0" max="1"></progress>
<canvas id="canvas">
</canvas>
<form id="form">
    <div>
        <label>
            Touch controls
            <input type="checkbox" id="touchControls">
        </label>
    </div>
    <div>
        <label>
            Player name
            <input id="username" type="text" required/>
        </label>
        <button type="submit">
            Start
        </button>
    </div>
</form>
<p id="warning" class="notDraggable">If it's not starting, try to enable microphone and refresh</p>
</body>
</html>
